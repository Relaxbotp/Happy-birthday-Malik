<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday, Malek 🎂🧸</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: #0a0a0f;
            background-image: radial-gradient(circle at 50% 0%, #1a103c 0%, #0a0a0f 70%);
            color: #fff;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- نجوم متلألئة في الخلفية --- */
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 10% 20%, #fff, transparent),
                radial-gradient(2px 2px at 40% 60%, #ffb6c1, transparent),
                radial-gradient(2px 2px at 70% 30%, #00ffff, transparent),
                radial-gradient(1px 1px at 90% 80%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 30% 90%, #ffd700, transparent);
            background-size: 200px 200px;
            animation: twinkle 4s infinite alternate;
            z-index: 0;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* --- شاشة البداية (الهدية) --- */
        .intro-screen {
            position: absolute;
            z-index: 10;
            text-align: center;
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            cursor: pointer;
        }

        .gift-bear {
            font-size: 120px;
            animation: floatGift 2.5s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(255, 182, 193, 0.4));
            display: inline-block;
        }

        @keyframes floatGift {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        .intro-text {
            font-size: 20px;
            color: #ffd700;
            margin-top: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            animation: pulseText 2s infinite;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* --- الكارت الرئيسي --- */
        .main-card-wrapper {
            position: absolute;
            z-index: 5;
            width: 90%;
            max-width: 400px;
            opacity: 0;
            transform: scale(0.8) translateY(30px);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            padding: 2px;
            border-radius: 28px;
        }

        .main-card-wrapper.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        /* الإطار المتوهج الفخم */
        .main-card-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 28px;
            background: linear-gradient(45deg, #ff00cc, #3333ff, #00ffff, #ffd700, #ff00cc);
            background-size: 300% 300%;
            z-index: -1;
            animation: borderGlow 6s linear infinite;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-content {
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 26px;
            padding: 25px 20px;
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .bear-avatar {
            font-size: 60px;
            margin-bottom: 5px;
            animation: floatAvatar 3s ease-in-out infinite;
        }

        @keyframes floatAvatar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .friend-name {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 55px;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            margin-bottom: 0px;
            line-height: 1;
            direction: ltr;
        }

        .bday-title {
            font-size: 20px;
            color: #ff69b4;
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #ff69b4, transparent);
            margin: 10px auto 15px;
            width: 70%;
        }

        .message-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            min-height: 120px; /* زيادة الطول شوية عشان الكلام الجديد */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-text {
            font-size: 16px;
            line-height: 1.8;
            color: #e0e0e0;
            font-weight: 700;
            text-align: center;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 15px;
            background-color: #00ffff;
            animation: blink 0.8s step-end infinite;
            vertical-align: middle;
            margin-right: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .from-relax {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .from-relax span {
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .action-btn {
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(255, 0, 204, 0.3);
        }

        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 0, 204, 0.5);
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <!-- شاشة البداية (الهدية) -->
    <div class="intro-screen" id="introScreen" onclick="openGift()">
        <div class="gift-bear">🧸🎁</div>
        <div class="intro-text">اضغط لفتح المفاجأة يا مالك 👆</div>
    </div>

    <!-- الكارت الرئيسي -->
    <div class="main-card-wrapper" id="mainCard">
        <div class="card-content">
            <div class="bear-avatar">🧸</div>
            <div class="friend-name">Malek</div>
            <div class="bday-title">Happy Birthday! 🎂</div>
            
            <div class="divider"></div>
            
            <div class="message-box">
                <div class="message-text" id="typewriter"></div><span class="cursor" id="cursor"></span>
            </div>

            <div class="from-relax">
                هدية من صاحبك الدبدوب <span>Relax</span> ❤️
            </div>

            <button class="action-btn" onclick="magicHearts()">أرسل قلوب 💖</button>
        </div>
    </div>

    <script>
        // --- 1. وظيفة فتح الهدية ---
        function openGift() {
            const intro = document.getElementById('introScreen');
            const card = document.getElementById('mainCard');
            
            intro.style.transform = 'scale(0) translateY(50px)';
            intro.style.opacity = '0';
            
            setTimeout(() => {
                intro.style.display = 'none';
                card.classList.add('show');
                fireConfetti();
                typeWriter();
            }, 600);
        }

        // --- 2. تأثير القصاصات ---
        function fireConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;
            var colors = ['#ff00cc', '#3333ff', '#00ffff', '#ffd700', '#ff69b4'];

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: colors
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // --- 3. تأثير الكتابة (الرسالة الجديدة) ---
        // غيرت الكلام هنا لرسالتك عن اليوزر النادر
        const message = "دي هديه مني ليك يوزر ثلاثي نادر @vh0\n\nالحق خده يفحل قبل ما حد ياخد\n\nوبحبك 🥀💕";
        let i = 0;
        
        function typeWriter() {
            if (i < message.length) {
                const char = message.charAt(i);
                if (char === '\n') {
                    document.getElementById('typewriter').innerHTML += '<br>';
                } else {
                    document.getElementById('typewriter').innerHTML += char;
                }
                i++;
                setTimeout(typeWriter, 50); // سرعة الكتابة
            } else {
                document.getElementById('cursor').style.display = 'none';
            }
        }

        // --- 4. زر القلوب التفاعلي ---
        function magicHearts() {
            confetti({
                particleCount: 40,
                spread: 100,
                origin: { y: 0.8 },
                colors: ['#ff69b4', '#ff1493', '#ff0000'],
                shapes: ['circle'],
                scalar: 1.5
            });
        }
    </script>
</body>
</html>
