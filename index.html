<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday, Malek</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            /* لون أسود ملكي مع لمسة ذهبية */
            background: #0a0808;
            background-image: radial-gradient(circle at top, #1f1811 0%, #0a0808 100%);
            color: #fff;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- شاشة البداية (الهدية) --- */
        .intro-screen {
            position: absolute;
            z-index: 10;
            text-align: center;
            transition: all 0.6s ease;
            cursor: pointer;
        }

        .gift-box {
            font-size: 110px;
            animation: pulseGift 2s infinite alternate;
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
        }

        @keyframes pulseGift {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .intro-text {
            font-size: 20px;
            color: #d4af37; /* ذهبي */
            margin-top: 20px;
            font-weight: 700;
            animation: blinkText 2s infinite;
        }

        @keyframes blinkText {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* --- الكارت الرئيسي --- */
        .main-card {
            position: absolute;
            z-index: 5;
            width: 90%;
            max-width: 380px;
            background: #14100e;
            border: 2px solid #d4af37; /* إطار ذهبي */
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
            pointer-events: none;
        }

        .main-card.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .bear-icon {
            font-size: 60px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
        }

        .friend-name {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 50px;
            color: #d4af37; /* ذهبي */
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            margin-bottom: 5px;
            line-height: 1;
            direction: ltr;
        }

        .bday-title {
            font-size: 18px;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 0 auto 20px;
            width: 80%;
        }

        .message-box {
            background: #0a0808;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #33291c;
            position: relative;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-text {
            font-size: 16px;
            line-height: 1.8;
            color: #e0e0e0;
            font-weight: 600;
            text-align: center;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 15px;
            background-color: #d4af37;
            animation: blink 0.8s step-end infinite;
            vertical-align: middle;
            margin-right: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .from-relax {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
            font-weight: 700;
        }

        .from-relax span {
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .action-btn {
            background: #d4af37;
            border: none;
            color: #000;
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .action-btn:hover {
            background: #fce07e;
        }
    </style>
</head>
<body>

    <!-- شاشة البداية (الهدية) -->
    <div class="intro-screen" id="introScreen" onclick="openGift()">
        <div class="gift-box">🎁</div>
        <div class="intro-text">اضغط لفتح الهدية 👆</div>
    </div>

    <!-- الكارت الرئيسي -->
    <div class="main-card" id="mainCard">
        <div class="bear-icon">🧸</div>
        <div class="friend-name">Malek</div>
        <div class="bday-title">HAPPY BIRTHDAY</div>
        
        <div class="divider"></div>
        
        <div class="message-box">
            <div class="message-text" id="typewriter"></div><span class="cursor" id="cursor"></span>
        </div>

        <div class="from-relax">
            هدية من <span>Relax</span> ❤️
        </div>

        <button class="action-btn" onclick="magicHearts()">أرسل قلوب 💖</button>
    </div>

    <script>
        // فتح الهدية
        function openGift() {
            document.getElementById('introScreen').style.display = 'none';
            document.getElementById('mainCard').classList.add('show');
            
            // تشغيل القصاصات مرة واحدة (عشان ميهنجش)
            fireConfetti();
            // بدء كتابة الرسالة
            typeWriter();
        }

        // القصاصات
        function fireConfetti() {
            var colors = ['#d4af37', '#ffffff', '#fce07e'];
            confetti({ particleCount: 80, spread: 100, origin: { y: 0.6 }, colors: colors });
        }

        // الرسالة اللي بتتكتب
        const message = "دي هديه مني ليك يوزر ثلاثي نادر @vh0\n\nالحق خده يفحل قبل ما حد ياخد\n\nوبحبك 🥀💕";
        let i = 0;
        
        function typeWriter() {
            if (i < message.length) {
                const char = message.charAt(i);
                if (char === '\n') {
                    document.getElementById('typewriter').innerHTML += '<br>';
                } else {
                    document.getElementById('typewriter').innerHTML += char;
                }
                i++;
                setTimeout(typeWriter, 50); 
            } else {
                document.getElementById('cursor').style.display = 'none';
            }
        }

        // زر القلوب
        function magicHearts() {
            confetti({
                particleCount: 30,
                spread: 80,
                origin: { y: 0.8 },
                colors: ['#ff1493', '#ff0000', '#d4af37']
            });
        }
    </script>
</body>
</html>
