<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Malek 🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Playfair+Display:ital,wght@1,700&family=Lalezar&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0a0a0a;
            background-image: radial-gradient(circle at center, #1a1510 0%, #0a0a0a 100%);
            color: #fff;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* ================= الصفحة الأولى (الكارت) ================= */
        .card-page {
            width: 90%;
            max-width: 380px;
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
            transition: all 0.8s ease;
            position: relative;
            z-index: 10;
        }

        .bear-icon {
            font-size: 50px;
            margin-bottom: 5px;
        }

        .friend-name {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 50px;
            color: #d4af37;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            margin-bottom: 5px;
            line-height: 1;
            direction: ltr;
        }

        .bday-title {
            font-family: 'Great Vibes', cursive;
            font-size: 28px;
            color: #fff;
            margin-bottom: 15px;
        }

        .message-box {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #33291c;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .message-text {
            font-size: 16px;
            line-height: 1.8;
            color: #e0e0e0;
            font-weight: 600;
            text-align: center;
        }

        /* الخطوط المزخرفة */
        .fancy-ar {
            font-family: 'Lalezar', cursive;
            color: #d4af37;
            font-size: 20px;
        }

        .fancy-en {
            font-family: 'Great Vibes', cursive;
            color: #00ffff;
            font-size: 24px;
            direction: ltr;
        }

        .from-relax {
            font-size: 14px;
            color: #888;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .from-relax span { color: #d4af37; }

        /* زر الانتقال (مخفي في البداية) */
        .next-btn {
            background: linear-gradient(45deg, #d4af37, #fce07e);
            border: none;
            color: #000;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            display: none; /* مخفي */
        }

        .next-btn.show {
            opacity: 1;
            transform: translateY(0);
            display: inline-block;
        }

        /* ================= الصفحة الثانية (الدباديب) ================= */
        .scene-page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20vh;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            z-index: 5;
        }

        .scene-page.show {
            opacity: 1;
            pointer-events: auto;
        }

        .bears-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            width: 100%;
        }

        /* الدبدوب الأبيض (ريلاكس) */
        .bear-relax {
            font-size: 80px;
            position: relative;
            transform: translateX(-200px); /* خارج الشاشة */
            transition: transform 2.5s ease-in-out;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
        }

        /* الدبدوب التاني (مالك) */
        .bear-malek {
            font-size: 80px;
            position: relative;
            transform: translateX(200px); /* خارج الشاشة */
            transition: transform 2.5s ease-in-out;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
        }

        /* خدود حمرا */
        .cheeks::after {
            content: '';
            position: absolute;
            bottom: 25%;
            left: 15%;
            width: 70%;
            height: 20%;
            background: rgba(255, 0, 0, 0.3);
            border-radius: 50%;
            filter: blur(5px);
            z-index: -1;
        }

        /* حركة المشي */
        .walking .bear-relax { transform: translateX(-15%); }
        .walking .bear-malek { transform: translateX(15%); }
        
        /* حركة الحضن */
        .hugging .bear-relax { transform: translateX(5%) scale(1.1); }
        .hugging .bear-malek { transform: translateX(-5%) scale(1.1); }

        /* فقاعة الكلام */
        .speech-bubble {
            position: absolute;
            top: -60px;
            right: 20%;
            background: #fff;
            color: #000;
            padding: 10px 15px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 14px;
            opacity: 0;
            transform: scale(0);
            transition: all 0.5s ease;
            z-index: 10;
            width: 150px;
            text-align: center;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #fff transparent transparent transparent;
        }

        .speech-bubble.show {
            opacity: 1;
            transform: scale(1);
        }

        /* القلب الكبير */
        .big-heart {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 100px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }

        .big-heart.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.5);
            animation: pulseHeart 1s infinite alternate;
        }

        @keyframes pulseHeart {
            from { transform: translate(-50%, -50%) scale(1.5); }
            to { transform: translate(-50%, -50%) scale(1.7); }
        }

    </style>
</head>
<body>

    <!-- المشهد الأول (الكارت) -->
    <div class="card-page" id="cardPage">
        <div class="bear-icon">🧸</div>
        <div class="friend-name">Malek</div>
        <div class="bday-title">Happy Birthday</div>
        
        <div class="message-box">
            <div class="message-text" id="typewriter"></div><span class="cursor" id="cursor">|</span>
        </div>

        <div class="from-relax">
            هدية من <span>Relax</span> ❤️
        </div>

        <button class="next-btn" id="nextBtn" onclick="startScene()">المفاجأة الكبيرة 👆</button>
    </div>

    <!-- المشهد الثاني (الدباديب) -->
    <div class="scene-page" id="scenePage">
        
        <div class="speech-bubble" id="speech">أنت أغلى حد عندي يا مالك ❤️</div>
        
        <div class="bears-container" id="bearsContainer">
            <!-- دبدوب ريلاكس (أبيض بخدود حمرا) -->
            <div class="bear-relax cheeks">🐻‍❄️</div>
            
            <!-- دبدوب مالك -->
            <div class="bear-malek">🧸</div>
        </div>

        <div class="big-heart" id="bigHeart">💖</div>
    </div>

    <script>
        // --- 1. كتابة الكلام في الكارت ---
        const message = "عارف إن الهدية متأخرة شوية.. بس كل سنة وإنت طيب يا مالك 🌟\n\nأتمنى لك سنة سعيدة مليانة نجاح وفرحة.\n\nعقبال 100 سنة يا رب!";
        let i = 0;
        const typewriter = document.getElementById('typewriter');
        const cursor = document.getElementById('cursor');
        const nextBtn = document.getElementById('nextBtn');

        function typeWriter() {
            if (i < message.length) {
                const char = message.charAt(i);
                if (char === '\n') {
                    typewriter.innerHTML += '<br>';
                } else {
                    typewriter.innerHTML += char;
                }
                i++;
                setTimeout(typeWriter, 50); 
            } else {
                // لما الكلام يخلص
                cursor.style.display = 'none'; // اخفاء المؤشر
                nextBtn.style.display = 'inline-block'; // اظهار الزر
                setTimeout(() => nextBtn.classList.add('show'), 100);
            }
        }

        // بدء الكتابة أول ما الصفحة تفتح
        window.onload = () => {
            setTimeout(typeWriter, 500);
        };

        // --- 2. الانتقال للمشهد التاني (الدباديب) ---
        function startScene() {
            // اخفاء الكارت
            const card = document.getElementById('cardPage');
            card.style.opacity = '0';
            card.style.transform = 'scale(0.8)';
            
            // اظهار المشهد
            const scene = document.getElementById('scenePage');
            scene.classList.add('show');

            const container = document.getElementById('bearsContainer');
            const speech = document.getElementById('speech');
            const bigHeart = document.getElementById('bigHeart');

            // 1. الدباديب بتمشي ناحية بعض (بعد ثانية)
            setTimeout(() => {
                container.classList.add('walking');
            }, 500);

            // 2. ريلاكس بيتكلم (بعد 3 ثواني)
            setTimeout(() => {
                speech.classList.add('show');
            }, 3000);

            // 3. الدباديب بتحضن بعض والفقاعة تختفي (بعد 5.5 ثواني)
            setTimeout(() => {
                speech.classList.remove('show');
                container.classList.add('hugging');
                bigHeart.classList.add('show');
            }, 5500);
        }
    </script>
</body>
</html>
