<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Malek 🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Playfair+Display:ital,wght@1,700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #050505;
            background-image: radial-gradient(circle at center, #1a1510 0%, #050505 100%);
            color: #fff;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* ================= المشهد الأول (الكارت) ================= */
        .card-page {
            width: 90%;
            max-width: 380px;
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: absolute;
            z-index: 10;
        }

        .bear-icon { font-size: 50px; margin-bottom: 5px; }

        .friend-name {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 50px;
            color: #d4af37;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            margin-bottom: 5px;
            line-height: 1;
            direction: ltr;
        }

        .bday-title {
            font-family: 'Great Vibes', cursive;
            font-size: 28px;
            color: #fff;
            margin-bottom: 15px;
        }

        .message-box {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #33291c;
            min-height: 160px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-text {
            font-size: 16px;
            line-height: 1.8;
            color: #e0e0e0;
            font-weight: 600;
            text-align: center;
        }

        .highlight {
            color: #00ffff;
            font-weight: 800;
            font-size: 18px;
        }

        .from-relax {
            font-size: 14px;
            color: #888;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .from-relax span { color: #d4af37; }

        .next-btn {
            background: linear-gradient(45deg, #d4af37, #fce07e);
            border: none;
            color: #000;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            display: none;
        }

        .next-btn.show { opacity: 1; transform: translateY(0); display: inline-block; }

        /* ================= المشهد الثاني (الأنيميشن) ================= */
        .scene-page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            z-index: 5;
        }

        .scene-page.show { opacity: 1; pointer-events: auto; }

        /* خط الأرض عشان الدباديب متبقاش طايرة */
        .ground-line {
            position: absolute;
            bottom: 30%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
        }

        .bears-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
            max-width: 350px;
            height: 150px;
        }

        /* دبدوب ريلاكس (الأبيض) */
        .bear-relax {
            font-size: 80px;
            position: absolute;
            left: 0;
            transform: translateX(-100px);
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
            z-index: 2;
            transition: transform 0.1s; /* للحركة الناعمة */
        }

        /* دبدوب مالك (البني) */
        .bear-malek {
            font-size: 80px;
            position: absolute;
            right: 0;
            transform: translateX(100px);
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
            z-index: 2;
        }

        /* أنيميشن المشي (تنطيط) */
        @keyframes walkRight {
            0% { transform: translateX(-100px) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
            100% { transform: translateX(-10px) translateY(0); } /* بيقف جنب التاني */
        }

        @keyframes walkLeft {
            0% { transform: translateX(100px) translateY(0); }
            50% { transform: translateX(50%) translateY(-10px); }
            100% { transform: translateX(10px) translateY(0); } /* بيقف جنب التاني */
        }

        /* الكلاس اللي بيشغل المشي */
        .walking .bear-relax { animation: walkRight 3s ease-in-out forwards; }
        .walking .bear-malek { animation: walkLeft 3s ease-in-out forwards; }

        /* كلاس الحضن */
        .hugging .bear-relax { transform: translateX(-5px) scale(1.1) rotate(5deg); transition: all 0.5s ease; }
        .hugging .bear-malek { transform: translateX(5px) scale(1.1) rotate(-5deg); transition: all 0.5s ease; }

        /* فقاعة الكلام */
        .speech-bubble {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: #fff;
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 16px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            white-space: nowrap;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #fff transparent transparent transparent;
        }

        .speech-bubble.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* القلب الكبير */
        .big-heart {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 120px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
            filter: drop-shadow(0 0 20px rgba(255, 0, 100, 0.6));
        }

        .big-heart.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.5);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: translate(-50%, -50%) scale(1.5); }
            to { transform: translate(-50%, -50%) scale(1.7); }
        }
    </style>
</head>
<body>

    <!-- المشهد الأول (الكارت) -->
    <div class="card-page" id="cardPage">
        <div class="bear-icon">🧸</div>
        <div class="friend-name">Malek</div>
        <div class="bday-title">Happy Birthday</div>
        
        <div class="message-box">
            <div class="message-text" id="typewriter"></div><span id="cursor">|</span>
        </div>

        <div class="from-relax">
            هدية من <span>Relax</span> ❤️
        </div>

        <button class="next-btn" id="nextBtn" onclick="startScene()">شوف المفاجأة 👆</button>
    </div>

    <!-- المشهد الثاني (الأنيميشن) -->
    <div class="scene-page" id="scenePage">
        <div class="speech-bubble" id="speech">كل سنة وانت طيب يا مالك ❤️</div>
        
        <div class="ground-line"></div>
        
        <div class="bears-container" id="bearsContainer">
            <div class="bear-relax">🐻‍❄️</div>
            <div class="bear-malek">🧸</div>
        </div>

        <div class="big-heart" id="bigHeart">💖</div>
    </div>

    <script>
        // الكلام اللي هيتكتب (شامل هدية اليوزر)
        const message = "عارف إن الهدية متأخرة شوية.. بس كل سنة وإنت طيب يا مالك 🌟<br><br>دي هدية يوزر ثلاثي نادر <span class='highlight'>@vh0</span><br><br>الحق خده يفحل قبل ما حد ياخد.. وبحبك 🥀💕";
        let i = 0;
        const textElement = document.getElementById('typewriter');
        const cursor = document.getElementById('cursor');
        const nextBtn = document.getElementById('nextBtn');

        // دالة الكتابة (بندعم HTML)
        function typeWriter() {
            // استخراج النص العادي من الـ HTML
            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = message;
            const textOnly = tempDiv.innerText;
            
            if (i < textOnly.length) {
                textElement.innerHTML += textOnly.charAt(i);
                i++;
                setTimeout(typeWriter, 40);
            } else {
                // لما يخلص، نحط الكلام كامل بالـ HTML عشان اليوزر يبقى ملون
                textElement.innerHTML = message;
                cursor.style.display = 'none';
                nextBtn.style.display = 'inline-block';
                setTimeout(() => nextBtn.classList.add('show'), 100);
            }
        }

        window.onload = () => setTimeout(typeWriter, 300);

        // تشغيل الأنيميشن
        function startScene() {
            const card = document.getElementById('cardPage');
            card.style.opacity = '0';
            card.style.transform = 'scale(0.8) translateY(-50px)';
            
            setTimeout(() => {
                card.style.display = 'none';
                const scene = document.getElementById('scenePage');
                scene.classList.add('show');

                const container = document.getElementById('bearsContainer');
                const speech = document.getElementById('speech');
                const bigHeart = document.getElementById('bigHeart');

                // الدباديب بتمشي
                setTimeout(() => container.classList.add('walking'), 300);

                // ريلاكس بيتكلم
                setTimeout(() => speech.classList.add('show'), 3200);

                // الحضن والقلب
                setTimeout(() => {
                    speech.classList.remove('show');
                    container.classList.add('hugging');
                    bigHeart.classList.add('show');
                }, 5500);

            }, 500);
        }
    </script>
</body>
</html>
